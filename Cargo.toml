[package]
name = "iptv-proxy"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
description = "Reverse proxy for IPTV M3U playlists and Xtream Codes server APIs"
license = "GPL-3.0-only"

[[bin]]
name = "iptv-proxy"
path = "src/main.rs"

[lib]
name = "iptv_proxy"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
