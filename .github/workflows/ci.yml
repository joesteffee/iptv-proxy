name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Unit tests, the byte-exact playlist replay against real Go output
      # (tests/fixtures/go-playlist-slice.m3u), the contract suites for both server modes
      # (plain M3U and Xtream) and the environment-variable parity suite.
      - name: Test
        run: cargo test --all-targets --locked

  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/iptv-proxy --help
